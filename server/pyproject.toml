[project]
name = "local-companion"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "websockets",
    "litellm",
    "python-dotenv",
    "httpx",
    # Parsing (local-only)
    "tree-sitter",
    "tree-sitter-languages",
    # Embeddings (local-only)
    "numpy",
    "light-embed",
    # Ignore patterns (.gitignore support)
    "pathspec",
    # File watching
    "watchdog",
]

[project.optional-dependencies]
build = [
    "nuitka",
    "ordered-set",
    "zstandard",
]
gpu = [
    "onnxruntime-gpu",
]
# Video Editor generation dependencies
video_editor = [
    # TTS
    "TTS>=0.22.0",
    # Image/Video generation
    "diffusers>=0.29.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "torch>=2.3.0",
    # Video assembly
    "moviepy>=2.0.0",
    # Image processing
    "Pillow>=10.0.0",
    "scipy>=1.12.0",
]
